<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <script>/* Dominio oficial: los dominios técnicos de Firebase redirigen a cubierto.menu */if(/\.(web\.app|firebaseapp\.com)$/.test(location.hostname))location.replace('https://cubierto.menu'+location.pathname+location.search+location.hash);</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cubierto — Mis restaurantes</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="stylesheet" href="./Css/auth.css?v=3">
</head>
<body>

    <!-- Topbar -->
    <nav class="dash-topbar">
        <span class="app-name">Cubierto</span>
        <div class="user-info">
            <span class="user-name" id="userName"></span>
            <a id="superAdminLink" href="superadmin.html" style="display:none;color:#7C6C5C;font-size:0.8rem;text-decoration:none;border:1px solid rgba(124,108,92,0.25);padding:4px 10px;border-radius:6px;transition:all 0.15s;display:none;align-items:center;gap:4px"><i data-lucide="settings" style="width:13px;height:13px;stroke-width:1.75;vertical-align:middle"></i> SuperAdmin</a>
            <button class="btn-support" id="supportBtn" title="¿Necesitás ayuda? Escribinos"><i data-lucide="life-buoy" style="width:14px;height:14px;stroke-width:1.75"></i> Soporte</button>
            <button class="theme-btn" id="themeBtn"><i data-lucide="sun" style="width:15px;height:15px;stroke-width:1.75"></i></button>
            <button class="btn-logout" id="logoutBtn">Cerrar sesión</button>
        </div>
    </nav>

    <!-- Main -->
    <main class="dash-main">
        <div class="plan-banner" id="planBanner" hidden></div>
        <div class="dash-header">
            <h2>Mis restaurantes</h2>
            <button class="btn-new" id="newRestBtn">+ Nuevo restaurante</button>
        </div>
        <div class="restaurants-grid" id="restaurantsGrid">
            <p class="empty-state">Cargando...</p>
        </div>
    </main>

    <!-- Modal: Crear restaurante -->
    <div class="modal-overlay" id="newRestModal">
        <div class="modal-box">
            <h3>Nuevo restaurante</h3>
            <input type="text" id="newRestName" placeholder="Nombre del restaurante" maxlength="60">
            <div class="modal-actions">
                <button class="btn-cancel" id="cancelNewRest">Cancelar</button>
                <button class="btn-confirm" id="confirmNewRest">Crear</button>
            </div>
        </div>
    </div>

    <!-- Modal: Soporte -->
    <div class="modal-overlay" id="supportModal">
        <div class="modal-box support-box">
            <h3>¿En qué te podemos ayudar?</h3>
            <p class="support-sub">Escribinos por el medio que prefieras y te respondemos a la brevedad.</p>
            <div class="support-options" id="supportOptions"></div>
            <p class="support-hours" id="supportHours" hidden></p>
            <div class="modal-actions">
                <button class="btn-cancel" id="closeSupport">Cerrar</button>
            </div>
        </div>
    </div>

    <!-- Modal: QR Code -->
    <div class="modal-overlay" id="qrModal">
        <div class="modal-box qr-content">
            <h3 id="qrRestName"></h3>
            <canvas id="qrCanvas" width="240" height="240" style="display:block;margin:0 auto;border-radius:10px;"></canvas>
            <div class="qr-url-row">
                <input type="text" id="qrUrl" readonly>
                <button class="btn-copy" id="copyUrlBtn">Copiar</button>
            </div>
            <div class="modal-actions" style="margin-top:1rem">
                <button class="btn-cancel" id="closeQrModal">Cerrar</button>
                <a id="qrDownloadBtn" class="btn-confirm" style="text-decoration:none;padding:8px 18px" download="qr-menu.png">Descargar QR</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/lucide@0.309.0/dist/umd/lucide.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="./Js/theme.js"></script>
    <script src="./Js/firebase-config.js?v=4"></script>
    <script src="./Js/benefits-config.js?v=2"></script>
    <script src="https://unpkg.com/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
    <script src="./Js/dashboard.js?v=3"></script>
    <script>document.addEventListener('DOMContentLoaded', () => lucide.createIcons());</script>
</body>
</html>
