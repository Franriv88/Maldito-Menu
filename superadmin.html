<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <script>/* Dominio oficial: los dominios técnicos de Firebase redirigen a cubierto.menu */if(/\.(web\.app|firebaseapp\.com)$/.test(location.hostname))location.replace('https://cubierto.menu'+location.pathname+location.search+location.hash);</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuperAdmin — Cubierto</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    <style>
        /* ── PAGE ──────────────────────────────────── */
        body { background: #0e0e0e; }

        .sa-wrap {
            max-width: 1440px;
            margin: 0 auto;
            padding: 1.6rem 1.5rem 5rem;
            display: flex;
            flex-direction: column;
            gap: 1.6rem;
        }

        /* ── LOADING ───────────────────────────────── */
        .sa-loading {
            text-align: center;
            padding: 6rem 2rem;
            color: rgba(200,184,154,.4);
            font-size: .9rem;
            letter-spacing: 1px;
        }

        /* ── STATS ROW ─────────────────────────────── */
        .sa-stats {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 1rem;
        }
        .sa-stat {
            background: #1a1a1a;
            border: 1px solid rgba(124,108,92,.18);
            border-radius: 14px;
            padding: .9rem 1.1rem;
            display: flex;
            flex-direction: column;
            gap: .35rem;
        }
        .sa-stat-icon { font-size: .95rem; }
        .sa-stat-num {
            font-size: 1.8rem;
            font-weight: 700;
            color: #c8b89a;
            line-height: 1;
        }
        .sa-stat-label {
            font-size: .65rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: rgba(200,184,154,.45);
        }

        /* ── CHARTS ROW ────────────────────────────── */
        .sa-charts {
            display: grid;
            grid-template-columns: 1.6fr 1fr;
            gap: 1rem;
        }
        .sa-chart-card {
            background: #1a1a1a;
            border: 1px solid rgba(124,108,92,.18);
            border-radius: 14px;
            padding: 1.4rem 1.6rem;
        }
        .sa-chart-title {
            font-size: .72rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: rgba(200,184,154,.45);
            margin-bottom: 1.2rem;
        }

        /* ── SECTION ───────────────────────────────── */
        .sa-section {
            background: #1a1a1a;
            border: 1px solid rgba(124,108,92,.18);
            border-radius: 14px;
            overflow: hidden;
        }
        .sa-section-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.1rem 1.5rem;
            border-bottom: 1px solid rgba(124,108,92,.12);
            flex-wrap: wrap;
            gap: .8rem;
        }
        .sa-section-title {
            font-size: .78rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: rgba(200,184,154,.45);
            margin: 0;
        }
        .sa-controls {
            display: flex;
            align-items: center;
            gap: .8rem;
            flex-wrap: wrap;
        }
        .sa-search {
            background: #111;
            border: 1px solid rgba(124,108,92,.2);
            border-radius: 8px;
            color: #c8b89a;
            font-size: .78rem;
            padding: .35rem .8rem;
            outline: none;
            width: 180px;
        }
        .sa-search::placeholder { color: rgba(200,184,154,.3); }
        .sa-search:focus { border-color: rgba(124,108,92,.45); }

        .sa-filter-tabs { display: flex; gap: .3rem; flex-wrap: wrap; }
        .del-box { text-align: left; font-size: .84rem; line-height: 1.5; }
        .del-box p { margin: 0 0 10px; }
        .del-money { margin: 0 0 12px; padding: 10px 12px; border-radius: 8px; background: rgba(200,184,154,.06); border: 1px solid rgba(200,184,154,.18); }
        .del-flag { display: inline-block; margin-top: 6px; color: #e0a060; }
        .del-q { display: flex; flex-direction: column; gap: 4px; margin: 10px 0 0; }
        .del-q label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
        .del-hint { margin: 4px 0 0; font-size: .76rem; color: rgba(200,184,154,.6); }
        .sa-baja { display: inline-flex; align-items: center; gap: 4px; margin-top: 4px; padding: .12rem .5rem; border-radius: 5px; font-size: .66rem;
            background: rgba(220,140,60,.1); border: 1px solid rgba(220,140,60,.35); color: #e0a060; white-space: nowrap; }
        body.light .sa-baja { color: #a0601c; }
        .sa-tab {
            background: none;
            border: 1px solid rgba(124,108,92,.2);
            color: rgba(200,184,154,.45);
            border-radius: 20px;
            padding: .25rem .75rem;
            font-size: .7rem;
            cursor: pointer;
            transition: all .15s;
        }
        .sa-tab.active, .sa-tab:hover {
            border-color: rgba(124,108,92,.5);
            color: #c8b89a;
            background: rgba(124,108,92,.08);
        }

        /* ── TABLE ─────────────────────────────────── */
        .sa-table-wrap { overflow-x: auto; }
        .sa-table {
            width: 100%;
            border-collapse: collapse;
            font-size: .8rem;
        }
        .sa-table thead th {
            padding: .75rem 1.2rem;
            text-align: left;
            font-size: .65rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: rgba(200,184,154,.35);
            border-bottom: 1px solid rgba(124,108,92,.1);
            white-space: nowrap;
        }
        .sa-table tbody tr {
            border-bottom: 1px solid rgba(124,108,92,.07);
            transition: background .15s;
        }
        .sa-table tbody tr:last-child { border-bottom: none; }
        .sa-table tbody tr:hover { background: rgba(124,108,92,.04); }
        .sa-table td {
            padding: .9rem 1.2rem;
            vertical-align: middle;
            color: rgba(200,184,154,.75);
        }

        /* ── USER CELL ─────────────────────────────── */
        .sa-user-cell { display: flex; align-items: center; gap: .75rem; }
        .sa-avatar {
            width: 34px; height: 34px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: .75rem; font-weight: 700;
            flex-shrink: 0;
            color: #0e0e0e;
        }
        .sa-user-name { font-weight: 500; color: #c8b89a; font-size: .82rem; }
        .sa-user-email { font-size: .68rem; color: rgba(200,184,154,.4); margin-top: .1rem; }

        /* ── BADGES ────────────────────────────────── */
        .sa-badge {
            display: inline-flex; align-items: center;
            border-radius: 20px; padding: .2rem .7rem;
            font-size: .68rem; font-weight: 600;
            letter-spacing: .3px; white-space: nowrap;
        }
        .sa-badge-rest {
            background: rgba(124,108,92,.12);
            color: rgba(200,184,154,.7);
            border: 1px solid rgba(124,108,92,.2);
        }
        .sa-badge-active {
            background: rgba(40,167,69,.12);
            color: #5cbf7a;
            border: 1px solid rgba(40,167,69,.25);
        }
        .sa-badge-unpaid {
            background: rgba(240,160,0,.1);
            color: #f0a500;
            border: 1px solid rgba(240,160,0,.25);
        }
        .sa-badge-blocked {
            background: rgba(220,53,69,.1);
            color: #e06070;
            border: 1px solid rgba(220,53,69,.25);
        }
        .sa-badge-pending {
            background: rgba(0,158,227,.1);
            color: #4dbfe8;
            border: 1px solid rgba(0,158,227,.25);
        }

        /* ── ACTIONS ───────────────────────────────── */
        .sa-actions { display: flex; gap: .4rem; flex-wrap: wrap; }
        .sa-btn {
            border-radius: 6px; padding: .25rem .7rem;
            font-size: .68rem; cursor: pointer;
            border: 1px solid; transition: all .15s;
            white-space: nowrap;
        }
        .sa-btn-paid {
            background: rgba(40,167,69,.1);
            border-color: rgba(40,167,69,.35);
            color: #5cbf7a;
        }
        .sa-btn-paid:hover { background: rgba(40,167,69,.2); }
        .sa-btn-unpaid {
            background: rgba(240,160,0,.08);
            border-color: rgba(240,160,0,.35);
            color: #f0a500;
        }
        .sa-btn-unpaid:hover { background: rgba(240,160,0,.16); }
        .sa-btn-block {
            background: rgba(220,53,69,.08);
            border-color: rgba(220,53,69,.3);
            color: #e06070;
        }
        .sa-btn-block:hover { background: rgba(220,53,69,.18); }
        .sa-btn-unblock {
            background: rgba(124,108,92,.1);
            border-color: rgba(124,108,92,.35);
            color: #c8b89a;
        }
        .sa-btn-unblock:hover { background: rgba(124,108,92,.2); }
        .sa-btn-delete {
            background: rgba(180,30,40,.08);
            border-color: rgba(180,30,40,.25);
            color: rgba(220,80,80,.7);
        }
        .sa-btn-delete:hover { background: rgba(180,30,40,.18); color:#e06070; }
        .sa-btn-view {
            background: rgba(124,108,92,.08);
            border-color: rgba(124,108,92,.28);
            color: rgba(200,184,154,.65);
        }
        .sa-btn-view:hover { background: rgba(124,108,92,.18); color:#c8b89a; }

        .sa-empty {
            text-align: center; padding: 3rem;
            color: rgba(200,184,154,.3); font-size: .82rem;
        }

        /* ── PLAN CARDS ─────────────────────────────────── */
        .sa-plans-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(185px, 1fr));
            gap: .8rem;
        }
        .sa-plan-card {
            background: #111;
            border: 1px solid rgba(124,108,92,.18);
            border-radius: 12px;
            padding: 1.1rem 1rem .9rem;
            display: flex; flex-direction: column; gap: .45rem;
            position: relative;
        }
        .sa-plan-card.sa-plan-recommended { border-color: rgba(200,184,154,.32); background: rgba(200,184,154,.03); }
        .sa-plan-rec-badge {
            position: absolute; top: -9px; left: 50%; transform: translateX(-50%);
            background: #c8b89a; color: #0e0e0e;
            font-size: .5rem; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;
            padding: .18rem .65rem; border-radius: 10px; white-space: nowrap;
        }
        .sa-plan-name { font-size: .85rem; font-weight: 600; color: #c8b89a; margin-top: .25rem; }
        .sa-plan-price { font-size: 1.55rem; font-weight: 700; color: #ede4d8; line-height: 1; }
        .sa-plan-price span { font-size: .72rem; color: rgba(200,184,154,.5); font-weight: 400; }
        .sa-plan-meta { font-size: .68rem; color: rgba(200,184,154,.4); }
        .sa-plan-saving {
            font-size: .63rem; color: #5cbf7a;
            background: rgba(40,167,69,.1); border: 1px solid rgba(40,167,69,.2);
            border-radius: 8px; padding: .18rem .5rem; display: inline-block; width: fit-content;
        }
        .sa-plan-link-status { font-size: .63rem; padding: .2rem .5rem; border-radius: 6px; width: fit-content; }
        .sa-plan-link-status.has-link { color: #5cbf7a; background: rgba(40,167,69,.08); }
        .sa-plan-link-status.no-link  { color: #f0a500; background: rgba(240,160,0,.08); }
        .sa-plan-actions { display: flex; gap: .4rem; margin-top: auto; padding-top: .6rem; }

        @media (max-width: 900px) {
            .sa-stats { grid-template-columns: repeat(3,1fr); }
            .sa-charts { grid-template-columns: 1fr; }
        }
        @media (max-width: 600px) {
            .sa-stats { grid-template-columns: repeat(2,1fr); }
        }
    </style>
</head>
<body class="admin-page">

<!-- Topbar -->
<div class="admin-topbar">
    <div class="topbar-left">
        <span id="topbarRestName" style="color:#c8b89a;font-size:.95rem;font-weight:600">SuperAdmin</span>
        <a href="dashboard.html" class="btn-back"><i data-lucide="store" class="icon" style="width:13px;height:13px;stroke-width:1.75"></i> Mis restaurantes</a>
        <button class="btn-back sa-support-btn" id="supportCodeBtn" type="button" title="Editar el menú de un cliente con el código que te dio"><i data-lucide="life-buoy" class="icon" style="width:13px;height:13px;stroke-width:1.75"></i> Entrar con código de soporte</button>
    </div>
    <div class="topbar-right">
        <span id="topbarUserName"></span>
        <button class="theme-btn" id="themeBtn"><i data-lucide="sun" style="width:15px;height:15px;stroke-width:1.75"></i></button>
        <button id="saLogoutBtn">Cerrar sesión</button>
    </div>
</div>

<div id="saLoading" class="sa-loading">Cargando datos...</div>

<div class="sa-wrap" id="saContent" style="display:none">

    <!-- Planes de Suscripción -->
    <div class="sa-section" style="padding:1.2rem 1.5rem">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;flex-wrap:wrap;gap:.6rem">
            <div class="sa-section-title">Planes de suscripción</div>
            <button onclick="editPlan(-1)" style="background:rgba(40,167,69,.12);border:1px solid rgba(40,167,69,.28);color:#5cbf7a;border-radius:8px;padding:.38rem 1rem;font-size:.72rem;cursor:pointer;display:inline-flex;align-items:center;gap:5px"><i data-lucide="plus" class="icon" style="width:13px;height:13px;stroke-width:2"></i> Agregar plan</button>
        </div>
        <div id="periodsEditor" style="margin-bottom:1rem"></div>
        <div class="sa-plans-grid" id="plansList">
            <p style="color:rgba(200,184,154,.3);font-size:.78rem">Cargando planes...</p>
        </div>
    </div>

    <!-- Cupones -->
    <div class="sa-section" style="padding:1.2rem 1.5rem">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;flex-wrap:wrap;gap:.6rem">
            <div class="sa-section-title">Cupones de acceso</div>
            <button onclick="createCoupon()" style="background:rgba(40,167,69,.12);border:1px solid rgba(40,167,69,.28);color:#5cbf7a;border-radius:8px;padding:.38rem 1rem;font-size:.72rem;cursor:pointer;display:inline-flex;align-items:center;gap:5px"><i data-lucide="plus" class="icon" style="width:13px;height:13px;stroke-width:2"></i> Nuevo cupón</button>

            <div class="sa-section-title">Soporte para clientes</div>
            <button onclick="editSupport()" style="background:rgba(200,184,154,.08);border:1px solid rgba(200,184,154,.25);color:#c8b89a;border-radius:8px;padding:.38rem 1rem;font-size:.72rem;cursor:pointer;display:inline-flex;align-items:center;gap:5px"><i data-lucide="pencil" class="icon" style="width:13px;height:13px;stroke-width:2"></i> Editar</button>
        </div>
        <div id="supportInfo" style="font-size:.78rem;color:rgba(200,184,154,.6)">Cargando...</div>
    </div>

    <!-- Stats -->
    <div class="sa-stats" id="statsRow"></div>

    <!-- Charts -->
    <div class="sa-charts">
        <div class="sa-chart-card">
            <div class="sa-chart-title">Nuevos usuarios por mes</div>
            <canvas id="chartMonthly" style="max-height:160px"></canvas>
        </div>
        <div class="sa-chart-card">
            <div class="sa-chart-title">Estado de suscripciones</div>

        </div>

    <!-- Users table -->
    <div class="sa-section">
        <div class="sa-section-head">
            <h2 class="sa-section-title">Clientes</h2>

                <input type="search" class="sa-search" id="searchInput" placeholder="Buscar usuario...">

<script src="https://cdn.jsdelivr.net/npm/lucide@0.309.0/dist/umd/lucide.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="./Js/theme.js"></script>
<script src="./Js/firebase-config.js?v=4"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="./Js/benefits-config.js?v=4"></script>
<script src="./Js/support-access.js?v=1"></script>
<script>

const SUPERADMIN_EMAIL = 'frivasv2388@gmail.com';

let allUsers = [];
let appPlans = [];
let activeFilter = 'all';
let searchTerm   = '';
let chartMonthly, chartStatus;

// ── Auth guard ────────────────────────────────────────────────

auth.onAuthStateChanged(async user => {
    if (!user) { window.location.href = './login.html'; return; }
    if (user.email !== SUPERADMIN_EMAIL) { window.location.href = './dashboard.html'; return; }

    document.getElementById('topbarUserName').textContent = user.displayName || user.email;
    document.getElementById('saLogoutBtn').addEventListener('click', () =>
        auth.signOut().then(() => window.location.href = './login.html')
    );
    initThemeToggle('themeBtn');

    await loadData();
    await loadPlansConfig();
    renderStats(); renderTable();   // la tabla muestra el nombre del plan: redibujar con los planes ya cargados
    await loadCoupons();
    await loadSupport();
});

// ── Plan management ───────────────────────────────────────────
// appConfig/plans = { tiers: [{ id, label, monthlyPrice, benefits, recommended }],
//                     periods: { monthly|quarterly|annual|biennial: { discount, enabled } } }
// appPlans = niveles (tiers). El precio de cada período se calcula: mensual × meses × (1 − descuento).
let appPeriods = normalizePlans({}).periods;

async function loadPlansConfig() {
    try {
        const snap = await db.collection('appConfig').doc('plans').get();
        const cfg  = normalizePlans(snap.exists ? snap.data() : {});   // convierte el formato viejo (list) si hace falta
        appPlans   = cfg.tiers;
        appPeriods = cfg.periods;
    } catch(e) { console.error('Error cargando planes:', e); }
    renderPlans();
}

async function savePlans() {
    await db.collection('appConfig').doc('plans').set({
        tiers: appPlans.map(t => ({ id: t.id, label: t.label, monthlyPrice: Number(t.monthlyPrice) || 0, recommended: !!t.recommended, benefits: t.benefits || null })),
        periods: Object.fromEntries(PERIOD_ORDER.map(id => [id, { discount: appPeriods[id].discount, enabled: appPeriods[id].enabled }])),
    });
}

const saMoney = n => '$' + Math.round(n).toLocaleString('es-AR');

function renderPlans() {
    renderPeriodsEditor();
    const container = document.getElementById('plansList');
    if (!appPlans.length) {
        container.innerHTML = '<p style="color:rgba(200,184,154,.3);font-size:.78rem">No hay planes configurados.</p>';
        return;
    }
    const cfg = { tiers: appPlans, periods: appPeriods };
    container.innerHTML = appPlans.map((p, i) => {
        const benefitBadges = p.benefits ? BENEFITS_CONFIG.map(b => {
            const on  = hasBenefit(p.benefits, b.id);
            const lbl = b.id === 'restaurants' ? `${p.benefits.restaurants||1} rest.` : b.label;
            return `<span style="font-size:.6rem;padding:.15rem .45rem;border-radius:4px;${on
                ? 'background:rgba(40,167,69,.12);color:#5cbf7a;border:1px solid rgba(40,167,69,.25)'
                : 'background:rgba(124,108,92,.08);color:rgba(200,184,154,.3);border:1px solid rgba(124,108,92,.15)'}">${lbl}</span>`;
        }).join('') : '';
        const prices = PERIOD_ORDER.filter(id => appPeriods[id].enabled).map(id =>
            `<div style="display:flex;justify-content:space-between;font-size:.7rem;color:rgba(200,184,154,.55);padding:.1rem 0">
                <span>${appPeriods[id].label}</span><span>${saMoney(periodPrice(p, id, cfg))}${id !== 'monthly' ? ` <small style="color:#5cbf7a">(−${saMoney(periodSavings(p, id, cfg))})</small>` : ''}</span></div>`).join('');
        return `
        <div class="sa-plan-card ${p.recommended ? 'sa-plan-recommended' : ''}">
            ${p.recommended ? '<span class="sa-plan-rec-badge">✦ Recomendado</span>' : ''}
            <div class="sa-plan-name">${esc(p.label)}</div>
            <div class="sa-plan-price">${saMoney(p.monthlyPrice)} <span>ARS / mes</span></div>
            <div style="margin:.35rem 0 .2rem">${prices}</div>
            ${benefitBadges ? `<div style="display:flex;flex-wrap:wrap;gap:3px;margin:.4rem 0">${benefitBadges}</div>` : ''}
            <div class="sa-plan-actions">
                <button class="sa-btn sa-btn-unblock" onclick="editPlan(${i})" style="flex:1">Editar</button>
                <button class="sa-btn sa-btn-delete"  onclick="deletePlan(${i})">✕</button>
            </div>
        </div>`;
    }).join('');
}

// Descuentos por período (iguales para todos los niveles)
function renderPeriodsEditor() {
    const el = document.getElementById('periodsEditor');
    if (!el) return;
    el.innerHTML = `
        <div style="font-size:.62rem;letter-spacing:1px;text-transform:uppercase;color:rgba(200,184,154,.4);margin-bottom:.5rem">Períodos y descuento sobre el precio mensual</div>
        <div style="display:flex;flex-wrap:wrap;gap:.6rem">
        ${PERIOD_ORDER.map(id => {
            const p = appPeriods[id];
            return `<label style="display:flex;align-items:center;gap:.45rem;padding:.45rem .7rem;border:1px solid rgba(200,184,154,.15);border-radius:8px;font-size:.75rem;color:rgba(200,184,154,.75)">
                <input type="checkbox" data-period-on="${id}" ${p.enabled ? 'checked' : ''} ${id === 'monthly' ? 'disabled' : ''} style="accent-color:#c8b89a">
                ${p.label}
                ${id === 'monthly' ? '<span style="opacity:.5">(base)</span>' : `<input type="number" min="0" max="90" data-period-disc="${id}" value="${p.discount}" style="width:52px;background:#111;border:1px solid rgba(200,184,154,.2);border-radius:6px;color:#c8b89a;padding:.2rem .35rem;font-size:.75rem"> %`}
            </label>`;
        }).join('')}
        <button class="sa-btn sa-btn-unblock" onclick="savePeriods()" style="font-size:.7rem">Guardar períodos</button>
        </div>`;
}

async function savePeriods() {
    document.querySelectorAll('[data-period-on]').forEach(i => { if (i.dataset.periodOn !== 'monthly') appPeriods[i.dataset.periodOn].enabled = i.checked; });
    document.querySelectorAll('[data-period-disc]').forEach(i => {
        appPeriods[i.dataset.periodDisc].discount = Math.min(Math.max(parseInt(i.value) || 0, 0), 90);
    });
    try {
        await savePlans();
        renderPlans();
        Swal.fire({ toast:true, position:'top-end', icon:'success', title:'Períodos guardados', timer:2000, showConfirmButton:false, background:'#1a1a1a', color:'#c8b89a' });
    } catch(e) {
        Swal.fire({ toast:true, position:'top-end', icon:'error', title:'Error al guardar', timer:3000, showConfirmButton:false, background:'#1a1a1a', color:'#c8b89a' });
    }
}

async function editPlan(idx) {
    const isNew = idx < 0;
    const plan  = isNew
        ? { label: '', monthlyPrice: '', recommended: false }
        : appPlans[idx];

    const inp = 'width:100%;background:#111;border:1px solid rgba(200,184,154,.2);border-radius:8px;color:#c8b89a;font-size:.82rem;padding:.48rem .8rem;outline:none;font-family:inherit;margin-bottom:.5rem;box-sizing:border-box';
    const lbl = 'font-size:.62rem;letter-spacing:1px;text-transform:uppercase;color:rgba(200,184,154,.4);display:block;margin-bottom:.2rem;text-align:left';

    const { value: form, isConfirmed } = await Swal.fire({
        title: isNew ? 'Nuevo plan' : 'Editar plan',
        html: `<div style="text-align:left">
            <label style="${lbl}">Nombre del plan</label>
            <input id="sp-label" style="${inp}" value="${esc(plan.label)}" placeholder="Ej: Básico, Pro">
            <label style="${lbl}">Precio mensual (ARS)</label>
            <input id="sp-price" type="number" min="0" style="${inp}" value="${plan.monthlyPrice}" placeholder="10000">
            <p style="font-size:.7rem;color:rgba(200,184,154,.45);margin:-.2rem 0 .6rem">Trimestral, anual y bienal se calculan con los descuentos de los períodos.</p>
            <label style="display:flex;align-items:center;gap:.5rem;cursor:pointer;font-size:.8rem;color:rgba(200,184,154,.6);margin-top:.3rem">
                <input type="checkbox" id="sp-rec" ${plan.recommended ? 'checked' : ''} style="accent-color:#c8b89a">
                Marcar como recomendado
            </label>
            <div style="border-top:1px solid rgba(200,184,154,.12);margin-top:.8rem;padding-top:.8rem">
                <div style="${lbl}">Beneficios del plan</div>
                <div style="margin:.5rem 0 .6rem">
                    <div style="${lbl};margin-bottom:.3rem">Restaurantes</div>
                    <div style="display:flex;gap:.8rem">
                        ${[1,3,5].map(n => `<label style="display:flex;align-items:center;gap:.3rem;font-size:.8rem;color:rgba(200,184,154,.7);cursor:pointer">
                            <input type="radio" name="sp-restaurants" value="${n}" ${(Number(plan.benefits?.restaurants)||1)===n?'checked':''} style="accent-color:#c8b89a"> ${n}
                        </label>`).join('')}
                    </div>
                </div>
                ${BENEFITS_CONFIG.filter(b => b.type === 'bool').map(b => `
                    <label style="display:flex;align-items:center;gap:.5rem;cursor:pointer;font-size:.78rem;color:rgba(200,184,154,.65);margin:.3rem 0">
                        <input type="checkbox" id="sp-${b.id}" ${(b.optIn ? plan.benefits?.[b.id]===true : plan.benefits?.[b.id]!==false)?'checked':''} style="accent-color:#c8b89a">
                        ${b.label}
                    </label>`).join('')}
            </div>
        </div>`,
        focusConfirm: false,
        showCancelButton: true,
        confirmButtonText: isNew ? 'Crear plan' : 'Guardar',
        cancelButtonText: 'Cancelar',
        background: '#1a1a1a',
        color: '#c8b89a',
        confirmButtonColor: '#2d9a4e',
        cancelButtonColor: 'rgba(124,108,92,.3)',
        preConfirm: () => {
            const label        = document.getElementById('sp-label').value.trim();
            const monthlyPrice = +document.getElementById('sp-price').value;
            if (!label)                           { Swal.showValidationMessage('El nombre es obligatorio'); return false; }
            if (!monthlyPrice || monthlyPrice <= 0) { Swal.showValidationMessage('Ingresá un precio mensual válido'); return false; }
            const restaurants = parseInt(document.querySelector('input[name="sp-restaurants"]:checked')?.value || '1');
            const benefits = { restaurants };
            BENEFITS_CONFIG.filter(b => b.type === 'bool').forEach(b => {
                benefits[b.id] = document.getElementById(`sp-${b.id}`)?.checked ?? true;
            });
            return { label, monthlyPrice, recommended: document.getElementById('sp-rec').checked, benefits };
        },
    });
    if (!isConfirmed || !form) return;

    if (isNew) {
        appPlans.push({ id: String(Date.now()), ...form });
    } else {
        appPlans[idx] = { ...appPlans[idx], ...form };
    }
    try {
        await savePlans();
        renderPlans();
        Swal.fire({ toast:true, position:'top-end', icon:'success', title: isNew ? 'Plan creado' : 'Plan actualizado', timer:2000, showConfirmButton:false, background:'#1a1a1a', color:'#c8b89a' });
    } catch(e) {
        Swal.fire({ toast:true, position:'top-end', icon:'error', title:'Error al guardar', timer:3000, showConfirmButton:false, background:'#1a1a1a', color:'#c8b89a' });
    }

async function deletePlan(idx) {
    const plan = appPlans[idx];
    const { isConfirmed } = await Swal.fire({
        title: `¿Eliminar plan "${plan.label}"?`,
        text: 'Esta acción no se puede deshacer.',
        icon: 'warning',
        showCancelButton: true,
        confirmButtonText: 'Eliminar',
        cancelButtonText: 'Cancelar',
        background: '#1a1a1a',
        color: '#c8b89a',
        confirmButtonColor: '#c0392b',
        cancelButtonColor: 'rgba(124,108,92,.3)',
    });
    if (!isConfirmed) return;
    appPlans.splice(idx, 1);
    try {
        await savePlans();
        renderPlans();
        Swal.fire({ toast:true, position:'top-end', icon:'success', title:'Plan eliminado', timer:2000, showConfirmButton:false, background:'#1a1a1a', color:'#c8b89a' });
    } catch(e) {}
}

// ── Eliminación segura de una cuenta (function adminDeleteAccount) ──────────
// 1) Se ven las finanzas: plan, hasta cuándo pagó, pagos del período, parte no usada, arrepentimiento.
// 2) ¿Lo pidió el cliente? Sí → una confirmación. No → dos (la segunda: escribir su email).
// Siempre se corta el débito automático en Mercado Pago; la devolución (si se elige) sale por MP.
const SWAL_DARK = { background: '#1a1a1a', color: '#c8b89a', cancelButtonColor: 'rgba(124,108,92,.3)' };
// Email comparable: sin espacios ni caracteres invisibles, sin mayúsculas (igual que en functions)
const normEmail = v => String(v || '').normalize('NFKC').replace(/[\s\u200B-\u200D\u2060\uFEFF]/g, '').toLowerCase();

async function deleteUser(uid, name) {
    Swal.fire({ title: 'Revisando la cuenta…', didOpen: () => Swal.showLoading(), allowOutsideClick: false, ...SWAL_DARK });
    let fin;
    try { fin = await SupportAccess.call('adminDeleteAccount', { uid, action: 'preview' }); }
    catch (e) { Swal.fire({ icon: 'error', title: 'No se pudo revisar la cuenta', text: e.message, ...SWAL_DARK }); return; }

    const periodLabel = PERIODS_DEFAULT[fin.period]?.label?.toLowerCase() || '';
    const state = fin.trial ? `En prueba gratis hasta el ${fmtDay(fin.trialEndsAt)}`
        : fin.paidActive ? `Plan ${esc(fin.plan || '')} ${periodLabel}, pagado hasta el <b>${fmtDay(fin.paidUntil)}</b>`
        : fin.paidUntil ? `Plan vencido el ${fmtDay(fin.paidUntil)}` : 'Sin plan pago';
    const debit = fin.autoDebit ? `<b>Débito automático activo</b>: se va a cancelar en Mercado Pago.`
        : fin.renewalCancelled ? 'La renovación automática ya estaba cancelada.' : 'No tiene débito automático.';
    const hasMoney = fin.paidActive && fin.paidInPeriod > 0;
    const money = hasMoney ? `
        <div class="del-money">
            Pagó <b>${saMoney(fin.paidInPeriod)}</b> por el período del ${fmtDay(fin.periodStart)} al ${fmtDay(fin.paidUntil)}.
            Le quedan <b>${fin.remainingDays}</b> de ${fin.periodDays} días: la parte no usada es <b>${saMoney(fin.proportionalRefund)}</b>.
            ${fin.arrepentimiento ? '<br><span class="del-flag">Está dentro de los 10 días del primer pago: si pide la baja, corresponde devolverle todo (arrepentimiento).</span>' : ''}
        </div>` : '';

    const first = await Swal.fire({
        title: `Eliminar a ${esc(name)}`,
        width: 560,
        html: `<div class="del-box">
            <p>${state}.<br>${debit}<br>${fin.restaurants.length} restaurante${fin.restaurants.length === 1 ? '' : 's'}: se borra todo (menú, imágenes, mesas y pedidos).</p>
            ${money}
            <div class="del-q"><b>¿El cliente pidió la baja?</b>
                <label><input type="radio" name="delReq" value="yes"> Sí, me lo pidió</label>
                <label><input type="radio" name="delReq" value="no"> No, es decisión mía</label>
            </div>
            ${hasMoney ? `<div class="del-q"><b>Devolución por Mercado Pago</b>
                <label><input type="radio" name="delRefund" value="none"> Sin devolución</label>
                <label><input type="radio" name="delRefund" value="proportional"> Devolver la parte no usada (${saMoney(fin.proportionalRefund)})</label>
                <label><input type="radio" name="delRefund" value="full"> Devolver todo el período (${saMoney(fin.fullRefund)})</label>
                <p class="del-hint" id="delHint"></p>
            </div>` : ''}
            </div>`,
        showCancelButton: true, showDenyButton: !!fin.autoDebit,
        confirmButtonText: 'Continuar con la eliminación', denyButtonText: 'No eliminar: solo cancelar la renovación', cancelButtonText: 'Cancelar',
        confirmButtonColor: '#c0392b', denyButtonColor: 'rgba(124,108,92,.35)', reverseButtons: false, ...SWAL_DARK,
        didOpen: el => {
            Swal.hideLoading();   // viene de "Revisando la cuenta…": que el botón vuelva a ser "Continuar"
            const hint = el.querySelector('#delHint');
            const sync = () => {
                const req = el.querySelector('input[name="delReq"]:checked')?.value;
                if (!hasMoney || !req) return;
                // Sugerencia según los Términos: pedido por el cliente → sin devolución (salvo arrepentimiento);
                // decisión del superadmin → se devuelve lo no usado
                const suggested = req === 'yes' ? (fin.arrepentimiento ? 'full' : 'none') : 'proportional';
                el.querySelector(`input[name="delRefund"][value="${suggested}"]`).checked = true;
                hint.textContent = req === 'yes'
                    ? (fin.arrepentimiento ? 'Arrepentimiento: los Términos prometen devolver todo dentro de los 10 días del primer pago.'
                                           : 'Según los Términos, si el cliente pide la baja no se devuelve el período ya empezado. Igual podés devolverle algo.')
                    : 'Si lo eliminás sin que lo pida, lo justo es devolverle la parte que no va a usar.';
            };
            el.querySelectorAll('input[name="delReq"]').forEach(r => r.addEventListener('change', sync));
        },
        preConfirm: () => {
            const req = Swal.getPopup().querySelector('input[name="delReq"]:checked')?.value;
            if (!req) { Swal.showValidationMessage('Indicá si el cliente pidió la baja.'); return false; }
            const refund = hasMoney ? Swal.getPopup().querySelector('input[name="delRefund"]:checked')?.value || 'none' : 'none';
            return { requestedByClient: req === 'yes', refund };
        },
    });

    if (first.isDenied) return cancelRenewal(uid, name, fin);
    if (!first.isConfirmed) return;
    const { requestedByClient, refund } = first.value;
    const refundAmount = refund === 'full' ? fin.fullRefund : refund === 'proportional' ? fin.proportionalRefund : 0;
    const summary = `Se cancela el débito automático, ${refundAmount ? `se devuelven <b>${saMoney(refundAmount)}</b> por Mercado Pago` : '<b>no</b> se devuelve dinero'}
        y se borran sus datos y sus ${fin.restaurants.length} restaurante(s). No se puede deshacer.`;

    let confirmEmail = '';
    if (requestedByClient) {
        const ok = await Swal.fire({ icon: 'warning', title: '¿Confirmás la eliminación?', html: `<span style="font-size:.88rem">${summary}</span>`,
            showCancelButton: true, confirmButtonText: 'Eliminar', cancelButtonText: 'Volver', confirmButtonColor: '#c0392b', ...SWAL_DARK });
        if (!ok.isConfirmed) return;
    } else {
        // Segunda confirmación: no lo pidió el cliente
        const second = await Swal.fire({
            icon: 'warning', title: 'Confirmación final',
            html: `<span style="font-size:.88rem">${esc(name)} <b>no pidió</b> la baja. ${summary}<br><br>Para confirmar, escribí su email:<br><b>${esc(fin.email || '')}</b></span>`,
            input: 'text', inputPlaceholder: fin.email || '', inputAttributes: { autocomplete: 'off', spellcheck: 'false' },
            showCancelButton: true, confirmButtonText: 'Eliminar definitivamente', cancelButtonText: 'Volver', confirmButtonColor: '#c0392b', ...SWAL_DARK,
            preConfirm: v => {
                if (normEmail(v) !== normEmail(fin.email)) {
                    Swal.showValidationMessage(`El email no coincide (se esperaban ${normEmail(fin.email).length} caracteres y escribiste ${normEmail(v).length}).`);
                    return false;
                }
                return v.trim();
            },
        });
        if (!second.isConfirmed) return;
        confirmEmail = second.value;
    }

    Swal.fire({ title: 'Eliminando…', didOpen: () => Swal.showLoading(), allowOutsideClick: false, ...SWAL_DARK });
    try {
        const r = await SupportAccess.call('adminDeleteAccount', { uid, action: 'delete', refund, requestedByClient, confirmEmail });
        allUsers = allUsers.filter(u => u.uid !== uid);
        renderStats(); renderCharts(); renderTable();
        Swal.fire({ icon: 'success', title: 'Cuenta eliminada',
            html: `<span style="font-size:.88rem">${r.cancelled ? 'Se canceló el débito automático. ' : ''}${r.refunded ? `Se devolvieron ${saMoney(r.refunded)} por Mercado Pago.` : 'Sin devolución.'}</span>`, ...SWAL_DARK });
    } catch (e) {
        Swal.fire({ icon: 'error', title: 'No se completó', text: e.message, ...SWAL_DARK });
    }
}

// Solo cortar el débito automático: el plan sigue hasta su vencimiento y la cuenta queda (aparece en "Bajas")
async function cancelRenewal(uid, name, fin) {
    const ok = await Swal.fire({ icon: 'question', title: `Cancelar la renovación de ${esc(name)}`,
        html: `<span style="font-size:.88rem">Se cancela el débito automático en Mercado Pago. ${fin.paidActive ? `Su plan sigue hasta el <b>${fmtDay(fin.paidUntil)}</b>` : 'No se le vuelve a cobrar'}; después podés eliminarla desde "Bajas".</span>`,
        showCancelButton: true, confirmButtonText: 'Cancelar renovación', cancelButtonText: 'Volver', confirmButtonColor: '#8a6a2a', ...SWAL_DARK });
    if (!ok.isConfirmed) return;
    try {
        await SupportAccess.call('adminDeleteAccount', { uid, action: 'cancelRenewal' });
        const u = allUsers.find(x => x.uid === uid);
        if (u) u.subscription = { ...(u.subscription || {}), billing: { ...(u.subscription?.billing || {}), status: 'cancelled', cancelledBy: 'admin' } };
        renderStats(); renderTable();
        Swal.fire({ toast: true, position: 'top-end', icon: 'success', title: 'Renovación cancelada', timer: 2500, showConfirmButton: false, ...SWAL_DARK });
    } catch (e) {
        Swal.fire({ icon: 'error', title: 'No se pudo cancelar', text: e.message, ...SWAL_DARK });
    }
}

let appCoupons = [];

async function saveCoupons() {

}

    el.innerHTML = `<table style="width:100%;border-collapse:collapse;font-size:.75rem">

            <th style="padding:.4rem .6rem;text-align:left">Plan</th>
            <th style="padding:.4rem .6rem;text-align:left">Usos</th>
            <th style="padding:.4rem .6rem;text-align:left">Activo</th>
            <th style="padding:.4rem .6rem"></th>
        </tr></thead>
        <tbody>${appCoupons.map((c, i) => {
            const plan = appPlans.find(p => p.id === c.planId);
            const used = c.usesCount || 0;
            const max  = c.usesMax   || '∞';

async function createCoupon() {
    const inp  = 'width:100%;background:#111;border:1px solid rgba(200,184,154,.2);border-radius:8px;color:#c8b89a;font-size:.82rem;padding:.48rem .8rem;outline:none;font-family:inherit;margin-bottom:.5rem;box-sizing:border-box';
    const lbl  = 'font-size:.62rem;letter-spacing:1px;text-transform:uppercase;color:rgba(200,184,154,.4);display:block;margin-bottom:.2rem;text-align:left';
    const planOptions = appPlans.map(p => `<option value="${p.id}">${esc(p.label)}</option>`).join('');

    const { value: form, isConfirmed } = await Swal.fire({
        title: 'Nuevo cupón',
        html: `<div style="text-align:left">
            <label style="${lbl}">Código del cupón</label>
            <input id="cp-code" style="${inp}" placeholder="ej: GRATIS2025" style="text-transform:uppercase">
            <label style="${lbl}">Plan que otorga</label>
            <select id="cp-plan" style="${inp}">${planOptions}</select>
            <label style="${lbl}">Por cuánto tiempo</label>
            <select id="cp-period" style="${inp}">${PERIOD_ORDER.map(id => `<option value="${id}">${PERIODS_DEFAULT[id].label} (${PERIODS_DEFAULT[id].months} ${PERIODS_DEFAULT[id].months === 1 ? 'mes' : 'meses'})</option>`).join('')}</select>
            <label style="${lbl}">Usos máximos (0 = ilimitado)</label>
            <input id="cp-uses" type="number" min="0" style="${inp}" value="1">
            <label style="${lbl}">Descripción (opcional)</label>
            <input id="cp-label" style="${inp}" placeholder="ej: Prueba gratuita para X">
        </div>`,
        focusConfirm: false,
        showCancelButton: true,
        confirmButtonText: 'Crear cupón',
        cancelButtonText: 'Cancelar',
        background: '#1a1a1a', color: '#c8b89a',
        confirmButtonColor: '#2d9a4e',
        cancelButtonColor: 'rgba(124,108,92,.3)',
        preConfirm: () => {
            const code  = document.getElementById('cp-code').value.trim().toUpperCase();
            const planId = document.getElementById('cp-plan').value;
            const period = document.getElementById('cp-period').value;
            const uses  = parseInt(document.getElementById('cp-uses').value) || 0;
            const label = document.getElementById('cp-label').value.trim();
            if (!code) { Swal.showValidationMessage('El código es obligatorio'); return false; }
            if (appCoupons.some(c => c.code === code)) { Swal.showValidationMessage('Ya existe un cupón con ese código'); return false; }
            return { code, planId, period, usesMax: uses, usesCount: 0, label, active: true };
        },
    });
    if (!isConfirmed || !form) return;
    appCoupons.push(form);
    await saveCoupons();
    renderCoupons();
    Swal.fire({ icon:'success', title:'Cupón creado', text: `Código: ${form.code}`, timer:2000, showConfirmButton:false, background:'#1a1a1a', color:'#c8b89a' });
}

async function deleteCoupon(i) {
    const { isConfirmed } = await Swal.fire({
        title: `Eliminar cupón "${appCoupons[i].code}"?`,
        icon: 'warning', showCancelButton: true,
        confirmButtonColor: '#d33', cancelButtonColor: 'rgba(124,108,92,.3)',
        confirmButtonText: 'Eliminar', cancelButtonText: 'Cancelar',
        background: '#1a1a1a', color: '#c8b89a',
    });
    if (!isConfirmed) return;
    appCoupons.splice(i, 1);
    await saveCoupons();
    renderCoupons();
}

async function toggleCoupon(i) {
    appCoupons[i].active = !appCoupons[i].active;
    await saveCoupons();
    renderCoupons();
}

async function loadData() {
    try {
        const [usersSnap, restsSnap] = await Promise.all([
            db.collection('users').get(),
            db.collection('restaurants').get(),
        ]);

        const usersMap = {};
        usersSnap.forEach(doc => { usersMap[doc.id] = { uid: doc.id, ...doc.data() }; });

        const restsByOwner = {};
        restsSnap.forEach(doc => {
            const d = doc.data();
            if (!restsByOwner[d.ownerId]) restsByOwner[d.ownerId] = [];
            restsByOwner[d.ownerId].push({ id: doc.id, nombre: d.nombre || 'Sin nombre' });
        });

        // Include owners without a users doc — show restaurant names as identifier
        Object.keys(restsByOwner).forEach(uid => {
            if (!usersMap[uid]) {
                const restNames = restsByOwner[uid].map(r => r.nombre).join(', ');
                usersMap[uid] = { uid, email: `UID: ${uid.slice(0,10)}…`, displayName: `Sin registro (${restNames})` };
            }
        });

        allUsers = Object.values(usersMap).map(u => ({
            ...u,
            restaurants: restsByOwner[u.uid] || [],
            subscription: u.subscription || { status: 'unpaid' }
        }));

        allUsers.sort((a, b) => (b.lastLogin?.seconds ?? 0) - (a.lastLogin?.seconds ?? 0));

        renderStats();
        renderCharts();
        renderTable();

        document.getElementById('saLoading').style.display  = 'none';
        document.getElementById('saContent').style.display  = '';
    } catch (err) {
        console.error(err);
        document.getElementById('saLoading').textContent = 'Error al cargar. Revisá la consola.';
    }
}

// ── Bajas: el cliente (o el superadmin) canceló la renovación automática ──
const isBaja = u => u.subscription?.billing?.status === 'cancelled';
const fmtDay = ms => ms ? new Date(ms).toLocaleDateString('es-AR', { day: 'numeric', month: 'short', year: 'numeric' }) : '—';

// ── Stats ─────────────────────────────────────────────────────

function renderStats() {
    const total     = allUsers.length;
    const effState  = u => subscriptionInfo(u.subscription, { tiers: appPlans, periods: appPeriods }).state;
    const active    = allUsers.filter(u => effState(u) === 'active').length;
    const unpaid    = allUsers.filter(u => ['none', 'expired'].includes(effState(u))).length;
    const blocked   = allUsers.filter(u => u.subscription?.status === 'blocked').length;
    const bajas     = allUsers.filter(isBaja).length;
    const totalRest = allUsers.reduce((acc, u) => acc + u.restaurants.length, 0);

    const cards = [
        { icon: 'users',          num: total,    label: 'Usuarios totales' },
        { icon: 'check-circle-2', num: active,   label: 'Suscripciones activas' },
        { icon: 'alert-triangle', num: unpaid,   label: 'Con deuda' },
        { icon: 'ban',            num: blocked,  label: 'Bloqueados' },
        { icon: 'user-minus',     num: bajas,    label: 'Bajas (renovación cancelada)' },
        { icon: 'store',          num: totalRest, label: 'Restaurantes totales' },
    ];

    document.getElementById('statsRow').innerHTML = cards.map(c => `
        <div class="sa-stat">
            <div class="sa-stat-icon">${licon(c.icon, 18)}</div>
            <div class="sa-stat-num">${c.num}</div>
            <div class="sa-stat-label">${c.label}</div>
        </div>`).join('');
}

// ── Charts ────────────────────────────────────────────────────

function renderCharts() {
    Chart.defaults.color = 'rgba(200,184,154,.5)';

    // Monthly registrations (last 6 months)
    const monthLabels = [];
    const monthData   = [];
    const now = new Date();
    const NAMES = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
    for (let i = 5; i >= 0; i--) {
        const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
        monthLabels.push(`${NAMES[d.getMonth()]} ${d.getFullYear()}`);
        const count = allUsers.filter(u => {
            if (!u.createdAt?.seconds) return false;
            const ud = new Date(u.createdAt.seconds * 1000);
            return ud.getFullYear() === d.getFullYear() && ud.getMonth() === d.getMonth();
        }).length;
        monthData.push(count);
    }

    const ctxM = document.getElementById('chartMonthly').getContext('2d');
    if (chartMonthly) chartMonthly.destroy();
    chartMonthly = new Chart(ctxM, {
        type: 'bar',
        data: {
            labels: monthLabels,
            datasets: [{
                label: 'Nuevos usuarios',
                data: monthData,
                backgroundColor: 'rgba(200,184,154,.25)',
                borderColor: 'rgba(200,184,154,.6)',
                borderWidth: 1,
                borderRadius: 6,
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
                x: { grid: { color: 'rgba(124,108,92,.1)' }, ticks: { font: { size: 10 } } },
                y: { grid: { color: 'rgba(124,108,92,.1)' }, ticks: { stepSize: 1, font: { size: 10 } }, beginAtZero: true }
            }
        }
    });

    // Status doughnut
    const active  = allUsers.filter(u => u.subscription?.status === 'active').length;
    const unpaid  = allUsers.filter(u => !u.subscription?.status || u.subscription.status === 'unpaid').length;
    const blocked = allUsers.filter(u => u.subscription?.status === 'blocked').length;

    const ctxS = document.getElementById('chartStatus').getContext('2d');
    if (chartStatus) chartStatus.destroy();
    chartStatus = new Chart(ctxS, {
        type: 'doughnut',
        data: {
            labels: ['Activos', 'Impagos', 'Bloqueados'],
            datasets: [{
                data: [active, unpaid, blocked],
                backgroundColor: ['rgba(40,167,69,.65)', 'rgba(240,160,0,.65)', 'rgba(220,53,69,.65)'],
                borderColor:     ['rgba(40,167,69,.3)',  'rgba(240,160,0,.3)',  'rgba(220,53,69,.3)'],
                borderWidth: 1,
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            cutout: '65%',
            plugins: {
                legend: {
                    position: 'bottom',
                    labels: { padding: 12, font: { size: 10 }, boxWidth: 10, color: 'rgba(200,184,154,.6)' }
                }
            }
        }
    });
}

// ── Table ─────────────────────────────────────────────────────

function renderTable() {
    const tbody  = document.getElementById('usersTableBody');
    const term   = searchTerm.toLowerCase();

    const filtered = allUsers.filter(u => {
        // Mismo estado que muestra la etiqueta de cada fila (un plan vencido cuenta como impago)
        const eff = subscriptionInfo(u.subscription, { tiers: appPlans, periods: appPeriods }).state;
        const matchFilter =
            activeFilter === 'all'     ? true :
            activeFilter === 'active'  ? eff === 'active' :
            activeFilter === 'unpaid'  ? ['none', 'expired'].includes(eff) :
            activeFilter === 'blocked' ? u.subscription?.status === 'blocked' :
            activeFilter === 'bajas'   ? isBaja(u) : true;

        const matchSearch = !term ||
            (u.displayName || '').toLowerCase().includes(term) ||
            (u.email || '').toLowerCase().includes(term);

        return matchFilter && matchSearch;
    });

    if (!filtered.length) {
        tbody.innerHTML = `<tr><td colspan="7" class="sa-empty">No hay usuarios que coincidan.</td></tr>`;
        return;
    }

    tbody.innerHTML = filtered.map(u => {
        // Estado efectivo: un plan "active" vencido o una prueba terminada se muestran como impagos
        const eff       = subscriptionInfo(u.subscription, { tiers: appPlans, periods: appPeriods }).state;
        const status    = eff === 'trial' ? 'trial' : eff === 'expired' ? 'unpaid' : (u.subscription?.status || 'unpaid');
        const badgeClass = status === 'active' ? 'sa-badge-active'
                         : status === 'trial' ? 'sa-badge-pending'
                         : status === 'blocked' ? 'sa-badge-blocked'
                         : status === 'pending_payment' ? 'sa-badge-pending'
                         : 'sa-badge-unpaid';
        const badgeText  = status === 'active' ? `${licon('check',11)} Activo`
                         : status === 'trial' ? `${licon('sparkles',11)} En prueba`
                         : status === 'blocked' ? `${licon('ban',11)} Bloqueado`
                         : status === 'pending_payment' ? `${licon('clock',11)} Pago pendiente`
                         : `${licon('alert-triangle',11)} Impago`;

        const paidUntil = u.subscription?.paidUntil?.seconds
            ? new Date(u.subscription.paidUntil.seconds * 1000).toLocaleDateString('es-AR', { day:'2-digit', month:'short', year:'numeric' })
            : '—';

        const lastLogin = u.lastLogin?.seconds
            ? timeAgo(u.lastLogin.seconds * 1000)
            : 'Nunca';

        const fullName = u.nombre && u.apellido ? `${u.nombre} ${u.apellido}` : null;
        const name    = esc(fullName || u.displayName || u.email?.split('@')[0] || 'Sin nombre');
        const email   = esc(u.email || u.uid.slice(0,12) + '…');
        const initials = (fullName || u.displayName || u.email || 'U').slice(0,2).toUpperCase();
        const color   = avatarColor(u.uid);

        const safeName = name.replace(/'/g, "\\'");
        const viewBtn = u.restaurants.length
            ? `<button class="sa-btn sa-btn-view" onclick="viewPanel('${u.uid}')">${licon('eye',12)} Ver</button>`
            : '';

        const actions = status === 'blocked'
            ? `${viewBtn}
               <button class="sa-btn sa-btn-unblock" onclick="setStatus('${u.uid}','unpaid')">${licon('shield-check',12)} Desbloquear</button>
               <button class="sa-btn sa-btn-delete"  onclick="deleteUser('${u.uid}','${safeName}')">${licon('trash-2',12)} Eliminar</button>`
            : status === 'pending_payment'
            ? `${viewBtn}
               <button class="sa-btn sa-btn-paid"  onclick="markPaid('${u.uid}')">${licon('check',12)} Confirmar pago</button>
               <button class="sa-btn sa-btn-block"  onclick="setStatus('${u.uid}','blocked')">${licon('ban',12)} Bloquear</button>
               <button class="sa-btn sa-btn-delete" onclick="deleteUser('${u.uid}','${safeName}')">${licon('trash-2',12)} Eliminar</button>`
            : `${viewBtn}
               ${status === 'trial' ? `<button class="sa-btn sa-btn-block" onclick="endTrial('${u.uid}','${safeName}')" title="Termina la prueba gratis ahora: el cliente tiene que elegir un plan para seguir editando">${licon('hourglass',12)} Terminar prueba</button>` : ''}
               <button class="sa-btn sa-btn-paid"  onclick="markPaid('${u.uid}')">${licon('credit-card',12)} Marcar pagado</button>
               <button class="sa-btn sa-btn-block"  onclick="setStatus('${u.uid}','blocked')">${licon('ban',12)} Bloquear</button>
               <button class="sa-btn sa-btn-delete" onclick="deleteUser('${u.uid}','${safeName}')">${licon('trash-2',12)} Eliminar</button>`;

        return `<tr>
            <td>
                <div class="sa-user-cell">
                    <div class="sa-avatar" style="background:${color}">${initials}</div>
                    <div>
                        <div class="sa-user-name">${name}</div>
                        <div class="sa-user-email">${email}</div>
                        ${u.phone ? `<div style="font-size:.65rem;color:rgba(200,184,154,.35);margin-top:.1rem">📞 ${esc(u.phone)}</div>` : ''}
                    </div>
                </div>
            </td>
            <td>
                <span class="sa-badge sa-badge-rest">${u.restaurants.length} rest.</span>
            </td>
            <td style="font-size:.75rem;color:rgba(200,184,154,.65)">
                ${(() => {
                    const inf = subscriptionInfo(u.subscription, { tiers: appPlans, periods: appPeriods });
                    const chip = t => `<span style="background:rgba(200,184,154,.08);border:1px solid rgba(200,184,154,.18);border-radius:5px;padding:.15rem .5rem;font-size:.68rem">${t}</span>`;
                    const baja = isBaja(u) ? `<br><span class="sa-baja" title="Canceló la renovación automática${u.subscription.billing.cancelledBy === 'admin' ? ' (la cancelaste vos)' : ''}">${licon('user-minus', 11)} Baja · ${inf.state === 'active' ? 'activo hasta ' + fmtDay(inf.until) : 'ya venció'}</span>` : '';
                    if (inf.state === 'trial') return chip(`Prueba · ${inf.daysLeft} d`) + baja;
                    if (inf.tier) return chip(`${esc(inf.tier.label)} · ${appPeriods[inf.period]?.label.toLowerCase() || ''}`) + baja;
                    return '<span style="color:rgba(200,184,154,.25);font-size:.7rem">—</span>' + baja;
                })()}
            </td>
            <td><span class="sa-badge ${badgeClass}">${badgeText}</span></td>
            <td style="font-size:.75rem;color:rgba(200,184,154,.5)">${paidUntil}</td>
            <td style="font-size:.75rem;color:rgba(200,184,154,.4)">${lastLogin}</td>
            <td><div class="sa-actions">${actions}</div></td>
        </tr>`;
    }).join('');
}

// ── Actions ───────────────────────────────────────────────────

// Terminar la prueba gratis antes de tiempo (soporte, abusos o pruebas de cobro): no se puede volver a pedir
async function endTrial(uid, name) {
    const u = allUsers.find(x => x.uid === uid);
    const hasDebit = ['authorized', 'pending'].includes(u?.subscription?.billing?.status);
    const { isConfirmed } = await Swal.fire({
        title: `¿Terminar la prueba de ${esc(name)}?`,
        html: `<span style="font-size:.88rem">Pasa a <b>Impago</b> ahora: su menú sigue visible, pero para editarlo tiene que elegir un plan. No puede volver a pedir la prueba.`
            + (hasDebit ? `<br><br>Ya había elegido un plan con débito automático: Mercado Pago lo va a cobrar en la fecha original (cuando terminaba la prueba).` : '') + `</span>`,
        icon: 'question', showCancelButton: true, confirmButtonText: 'Terminar prueba', cancelButtonText: 'Cancelar',
        background: '#1a1a1a', color: '#c8b89a', confirmButtonColor: '#8a6a2a', cancelButtonColor: 'rgba(124,108,92,.3)',
    });
    if (!isConfirmed) return;
    try {
        const sub = { status: 'unpaid', trialUsed: true, trialEndsAt: firebase.firestore.Timestamp.fromDate(new Date()) };
        await db.collection('users').doc(uid).set({ subscription: sub }, { merge: true });
        if (u) u.subscription = { ...u.subscription, ...sub };
        renderStats(); renderCharts(); renderTable();
        Swal.fire({ toast:true, position:'top-end', icon:'success', title:'Prueba terminada', timer:2000, showConfirmButton:false, background:'#1a1a1a', color:'#c8b89a' });
    } catch (err) {
        console.error(err);
        Swal.fire({ toast:true, position:'top-end', icon:'error', title:'Error al guardar', timer:3000, showConfirmButton:false, background:'#1a1a1a', color:'#c8b89a' });
    }
}

async function setStatus(uid, status) {
    const labels = { active: 'Activo', unpaid: 'Impago', blocked: 'Bloqueado' };
    const { isConfirmed } = await Swal.fire({
        title: `¿Cambiar a "${labels[status]}"?`,
        text: status === 'blocked' ? 'El usuario no podrá acceder al panel.' : '',
        icon: status === 'blocked' ? 'warning' : 'question',
        showCancelButton: true,
        confirmButtonText: 'Confirmar',
        cancelButtonText: 'Cancelar',
        background: '#1a1a1a',
        color: '#c8b89a',
        confirmButtonColor: status === 'blocked' ? '#c0392b' : '#2d9a4e',
        cancelButtonColor: 'rgba(124,108,92,.3)',
    });
    if (!isConfirmed) return;

    try {
        await db.collection('users').doc(uid).set(
            { subscription: { status } },
            { merge: true }
        );
        const u = allUsers.find(u => u.uid === uid);
        if (u) u.subscription = { ...u.subscription, status };
        renderStats();
        renderCharts();
        renderTable();
        Swal.fire({ toast:true, position:'top-end', icon:'success', title:'Actualizado', timer:2000, showConfirmButton:false, background:'#1a1a1a', color:'#c8b89a' });
    } catch (err) {
        console.error(err);
        Swal.fire({ toast:true, position:'top-end', icon:'error', title:'Error al guardar', timer:3000, showConfirmButton:false, background:'#1a1a1a', color:'#c8b89a' });
    }
}

async function markPaid(uid) {
    if (!appPlans.length) {
        Swal.fire({ toast:true, position:'top-end', icon:'warning', title:'No hay planes configurados', timer:3000, showConfirmButton:false, background:'#1a1a1a', color:'#c8b89a' });
        return;
    }
    const sel = 'width:100%;background:#111;border:1px solid rgba(200,184,154,.2);border-radius:8px;color:#c8b89a;font-size:.82rem;padding:.48rem .8rem;margin-bottom:.6rem';
    const cfg = { tiers: appPlans, periods: appPeriods };
    const defaultTier = (appPlans.find(p => p.recommended) || appPlans[0]).id;
    const { value: form, isConfirmed } = await Swal.fire({
        title: 'Confirmar pago',
        html: `<div style="text-align:left">
            <select id="mp-tier" style="${sel}">${appPlans.map(t => `<option value="${t.id}" ${t.id === defaultTier ? 'selected' : ''}>${esc(t.label)} — ${saMoney(t.monthlyPrice)}/mes</option>`).join('')}</select>
            <select id="mp-period" style="${sel}">${PERIOD_ORDER.map(id => `<option value="${id}">${appPeriods[id].label} (${appPeriods[id].months} ${appPeriods[id].months === 1 ? 'mes' : 'meses'})</option>`).join('')}</select>
            <p id="mp-total" style="font-size:.78rem;color:rgba(200,184,154,.6);margin:0"></p>
        </div>`,
        didOpen: () => {
            const upd = () => {
                const t = appPlans.find(x => x.id === document.getElementById('mp-tier').value);
                document.getElementById('mp-total').textContent = `Total del período: ${saMoney(periodPrice(t, document.getElementById('mp-period').value, cfg))}`;
            };
            document.getElementById('mp-tier').addEventListener('change', upd);
            document.getElementById('mp-period').addEventListener('change', upd);
            upd();
        },
        showCancelButton: true, confirmButtonText: 'Confirmar', cancelButtonText: 'Cancelar',
        background: '#1a1a1a', color: '#c8b89a', confirmButtonColor: '#2d9a4e', cancelButtonColor: 'rgba(124,108,92,.3)',
        preConfirm: () => ({ tierId: document.getElementById('mp-tier').value, period: document.getElementById('mp-period').value }),
    });
    if (!isConfirmed || !form) return;
    const plan = appPlans.find(p => p.id === form.tierId);
    if (!plan) return;

    // Si tiene un plan activo del mismo nivel y período, se suma al final; si no, empieza hoy
    const u    = allUsers.find(x => x.uid === uid);
    const info = subscriptionInfo(u?.subscription, cfg);
    const base = info.state === 'active' && info.tierId === form.tierId && info.period === form.period ? new Date(info.until) : new Date();
    const paidUntil = new Date(base);
    paidUntil.setMonth(paidUntil.getMonth() + PERIODS_DEFAULT[form.period].months);

    try {
        const subscription = { status: 'active', planType: plan.id, period: form.period, paidUntil: firebase.firestore.Timestamp.fromDate(paidUntil),
                               scheduled: firebase.firestore.FieldValue.delete() };
        await db.collection('users').doc(uid).set({ subscription }, { merge: true });
        if (u) u.subscription = { ...(u.subscription || {}), status: 'active', planType: plan.id, period: form.period, paidUntil: { seconds: Math.floor(paidUntil.getTime() / 1000) }, scheduled: null };
        renderStats(); renderCharts(); renderTable();
        Swal.fire({ toast:true, position:'top-end', icon:'success', title:`Plan "${plan.label}" (${appPeriods[form.period].label.toLowerCase()}) confirmado`, timer:2500, showConfirmButton:false, background:'#1a1a1a', color:'#c8b89a' });
    } catch (err) {
        console.error(err);
        Swal.fire({ toast:true, position:'top-end', icon:'error', title:'Error al guardar', timer:3000, showConfirmButton:false, background:'#1a1a1a', color:'#c8b89a' });
    }
}

// ── View panel (impersonation) ────────────────────────────────

async function viewPanel(uid) {
    const u = allUsers.find(u => u.uid === uid);
    if (!u || !u.restaurants.length) return;

    if (u.restaurants.length === 1) {
        window.open(`./admin.html?r=${u.restaurants[0].id}&readonly=1`, '_blank');
        return;
    }

    const btnStyle = [
        'display:inline-flex', 'align-items:center', 'gap:8px',
        'background:rgba(124,108,92,.1)', 'border:1px solid rgba(124,108,92,.22)',
        'color:#c8b89a', 'border-radius:10px', 'padding:.6rem 1.1rem',
        'font-size:.85rem', 'cursor:pointer',
        'transition:background .15s,border-color .15s', 'font-family:inherit',
    ].join(';');

    const html = `<div style="display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center">` +
        u.restaurants.map(r => `
            <button style="${btnStyle}"
                onmouseover="this.style.background='rgba(124,108,92,.22)';this.style.borderColor='rgba(124,108,92,.45)'"
                onmouseout="this.style.background='rgba(124,108,92,.1)';this.style.borderColor='rgba(124,108,92,.22)'"
                onclick="window.open('./admin.html?r=${r.id}&readonly=1','_blank');Swal.close()">
                ${licon('store', 14)} ${esc(r.nombre || 'Sin nombre')}
            </button>`).join('') + `</div>`;

    await Swal.fire({
        title: 'Elegí el restaurante',
        html,
        showConfirmButton: false,
        showCancelButton: true,
        cancelButtonText: 'Cancelar',
        background: '#1a1a1a',
        color: '#c8b89a',
        cancelButtonColor: 'rgba(124,108,92,.3)',
    });
}

// ── Acceso de soporte con el código del cliente (Js/support-access.js) ──
// Sin código, "Ver" abre el menú del cliente en solo lectura; con el código, se edita en "modo soporte"
async function enterWithSupportCode() {
    const { value: code } = await Swal.fire({
        title: 'Código de soporte',
        html: '<p style="font-size:.85rem;color:rgba(200,184,154,.7);margin:0">El cliente lo genera desde su panel: <b>Contactar soporte → Dar acceso a soporte</b>. Vale 24 horas.</p>',
        input: 'text', inputPlaceholder: 'ABCD-2345',
        inputAttributes: { autocapitalize: 'characters', autocomplete: 'off', spellcheck: 'false', maxlength: 12 },
        showCancelButton: true, confirmButtonText: 'Entrar', cancelButtonText: 'Cancelar',
        background: '#1a1a1a', color: '#c8b89a', confirmButtonColor: '#3a8f5c', cancelButtonColor: 'rgba(124,108,92,.3)',
        showLoaderOnConfirm: true,
        preConfirm: async v => {
            try { return await SupportAccess.redeem(v); }
            catch (e) { Swal.showValidationMessage(e.message); return false; }
        },
    });
    if (!code) return;
    await Swal.fire({
        icon: 'success', title: `Acceso a ${esc(code.nombre || 'el restaurante')}`,
        html: `<span style="font-size:.85rem">Podés editar hasta el <b>${SupportAccess.when(code.expiresAt)}</b>. El cliente lo puede revocar en cualquier momento.</span>`,
        confirmButtonText: 'Abrir el editor', background: '#1a1a1a', color: '#c8b89a', confirmButtonColor: '#3a8f5c',
    });
    window.open(`./admin.html?r=${encodeURIComponent(code.r)}`, '_blank');
}
document.getElementById('supportCodeBtn')?.addEventListener('click', enterWithSupportCode);

});

// ── Helpers ───────────────────────────────────────────────────

function timeAgo(ms) {
    const diff = Date.now() - ms;
    const m = Math.floor(diff / 60000);
    const h = Math.floor(diff / 3600000);
    const d = Math.floor(diff / 86400000);
    if (m < 2)  return 'Hace un momento';
    if (m < 60) return `Hace ${m} min`;
    if (h < 24) return `Hace ${h} h`;
    if (d < 30) return `Hace ${d} días`;
    return new Date(ms).toLocaleDateString('es-AR', { day:'2-digit', month:'short' });
}

const AVATAR_COLORS = ['#7C6C5C','#5C8070','#5C6C80','#80705C','#6C5C80','#5C7870'];
function avatarColor(uid) {
    let h = 0;
    for (let i = 0; i < uid.length; i++) h = (h * 31 + uid.charCodeAt(i)) & 0xffffffff;
    return AVATAR_COLORS[Math.abs(h) % AVATAR_COLORS.length];
}

function esc(str) {
    return String(str).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
