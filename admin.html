<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <script>/* Dominio oficial: los dominios técnicos de Firebase redirigen a cubierto.menu */if(/\.(web\.app|firebaseapp\.com)$/.test(location.hostname))location.replace('https://cubierto.menu'+location.pathname+location.search+location.hash);</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor de Menú</title>
    <script type="importmap">
    {
      "imports": {
        "https://cdn.jsdelivr.net/npm/lodash@4.17.21/+esm": "https://cdn.jsdelivr.net/npm/lodash-es@4.17.21/+esm"
      }
    }
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Cinzel:wght@400;700&family=Cormorant+Garant:ital,wght@0,300;0,400;1,300&family=Lobster&family=Dancing+Script:wght@400;700&family=UnifrakturMaguntia&family=Abril+Fatface&family=Oswald:wght@400;600&family=Merriweather:ital,wght@0,300;0,400;1,300&family=Pacifico&family=Great+Vibes&family=Raleway:wght@300;400;600&family=Bebas+Neue&family=Satisfy&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./Css/menu-styles.css?v=9">
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=9">
    <style>
        /* topbar heredado de styles.css */
    </style>
</head>
<body class="admin-page">

    <!-- Topbar -->
    <div class="admin-topbar">
        <div class="topbar-left">
            <a href="dashboard.html" class="btn-back"><i data-lucide="arrow-left" class="icon" style="width:13px;height:13px;stroke-width:2"></i> Panel</a>
            <span id="topbarRestName">Cargando...</span>
        </div>
        <div class="topbar-right">
            <span id="topbarUserName"></span>
            <a id="ordersLink" href="#"><i data-lucide="chef-hat" class="icon" style="width:13px;height:13px;stroke-width:1.75"></i> Pedidos</a>
            <a id="viewMenuLink" href="#" target="_blank"><i data-lucide="eye" class="icon" style="width:13px;height:13px;stroke-width:1.75"></i> Ver menú</a>
            <button class="theme-btn" id="themeBtn"><i data-lucide="sun" style="width:15px;height:15px;stroke-width:1.75"></i></button>
            <button id="logoutBtn">Cerrar sesión</button>
        </div>
    </div>

    <!-- Botón guardar (fijo) -->
    <div class="save-container">
        <button id="saveMenuBtn"><i data-lucide="save" style="width:17px;height:17px;stroke-width:1.75"></i><span>Guardar menú</span></button>
    </div>

    <div class="admin-layout">

        <div class="admin-menu-editor">
            <header id="adminHeader" style="text-align:center;padding:1rem;display:flex;align-items:center;justify-content:center;">
                <h2 id="adminRestName" style="color:#7C6C5C;margin:0;font-size:1.3rem"></h2>
                <img id="adminLogoPreview" style="display:none;max-width:100%;">
            </header>
            <main id="admin-menu-container">
                <p class="loading-msg">Verificando sesión...</p>
            </main>
        </div>

        <aside class="admin-sidebar">
            <h3 class="sidebar-title">Diseño</h3>

            <!-- Encabezado -->
            <div class="sidebar-section">
                <label class="ctrl-label">Encabezado del menú</label>
                <div class="seg-control" id="headerModeCtrl">
                    <button class="seg-btn active" data-value="text">Escribir título</button>
                    <button class="seg-btn" data-value="logo">Usar logo</button>
                </div>
            </div>

            <!-- Fuente de cuerpo -->
            <div class="sidebar-section">
                <label class="ctrl-label">Fuente de cuerpo</label>
                <select id="cfg-fontFamily" class="ctrl-select">
                    <optgroup label="Sans-serif">
                        <option value="sans-serif">Sans-serif (sistema)</option>
                        <option value="'Arial', sans-serif">Arial</option>
                        <option value="Verdana, sans-serif">Verdana</option>
                        <option value="'Trebuchet MS', sans-serif">Trebuchet MS</option>
                        <option value="'Oswald', sans-serif">Oswald</option>
                        <option value="'Raleway', sans-serif">Raleway</option>
                        <option value="'Bebas Neue', sans-serif">Bebas Neue</option>
                    </optgroup>
                    <optgroup label="Serif">
                        <option value="Georgia, serif">Georgia</option>
                        <option value="'Times New Roman', serif">Times New Roman</option>
                        <option value="'Merriweather', serif">Merriweather</option>
                        <option value="'Playfair Display', serif">Playfair Display</option>
                        <option value="'Cinzel', serif">Cinzel</option>
                        <option value="'Cormorant Garant', serif">Cormorant Garant</option>
                        <option value="'Libre Baskerville', serif">Libre Baskerville</option>
                    </optgroup>
                    <optgroup label="Caligráfica / Decorativa ✦" data-premium="extra_fonts">
                        <option value="'Lobster', cursive">Lobster ✦</option>
                        <option value="'Dancing Script', cursive">Dancing Script ✦</option>
                        <option value="'Pacifico', cursive">Pacifico ✦</option>
                        <option value="'Great Vibes', cursive">Great Vibes ✦</option>
                        <option value="'Satisfy', cursive">Satisfy ✦</option>
                        <option value="'Abril Fatface', cursive">Abril Fatface ✦</option>
                        <option value="'UnifrakturMaguntia', cursive">UnifrakturMaguntia ✦</option>
                    </optgroup>
                    <optgroup label="Monoespaciada">
                        <option value="'Courier New', monospace">Courier New</option>
                    </optgroup>
                </select>
            </div>

            <!-- Fuente de títulos (categorías) -->
            <div class="sidebar-section">
                <label class="ctrl-label">Fuente de títulos</label>
                <select id="cfg-titleFontFamily" class="ctrl-select">
                    <option value="">Igual que cuerpo</option>
                    <optgroup label="Sans-serif">
                        <option value="sans-serif">Sans-serif (sistema)</option>
                        <option value="'Arial', sans-serif">Arial</option>
                        <option value="'Oswald', sans-serif">Oswald</option>
                        <option value="'Raleway', sans-serif">Raleway</option>
                        <option value="'Bebas Neue', sans-serif">Bebas Neue</option>
                    </optgroup>
                    <optgroup label="Serif">
                        <option value="Georgia, serif">Georgia</option>
                        <option value="'Merriweather', serif">Merriweather</option>
                        <option value="'Playfair Display', serif">Playfair Display</option>
                        <option value="'Cinzel', serif">Cinzel</option>
                        <option value="'Cormorant Garant', serif">Cormorant Garant</option>
                        <option value="'Libre Baskerville', serif">Libre Baskerville</option>
                    </optgroup>
                    <optgroup label="Caligráfica / Decorativa ✦" data-premium="extra_fonts">
                        <option value="'Lobster', cursive">Lobster ✦</option>
                        <option value="'Dancing Script', cursive">Dancing Script ✦</option>
                        <option value="'Great Vibes', cursive">Great Vibes ✦</option>
                        <option value="'Satisfy', cursive">Satisfy ✦</option>
                        <option value="'Abril Fatface', cursive">Abril Fatface ✦</option>
                        <option value="'UnifrakturMaguntia', cursive">UnifrakturMaguntia ✦</option>
                    </optgroup>
                </select>
            </div>

            <!-- Tamaños de fuente — horizontal -->
            <div class="sidebar-section">
                <div class="size-controls-row">
                    <div class="size-ctrl">
                        <label class="ctrl-label">Cuerpo <span id="cfg-fontSizeVal" class="ctrl-value">14px</span></label>
                        <input type="range" id="cfg-fontSize" min="11" max="20" value="14" class="ctrl-slider">
                    </div>
                    <div class="size-ctrl">
                        <label class="ctrl-label">Títulos <span id="cfg-titleFontSizeVal" class="ctrl-value">20px</span></label>
                        <input type="range" id="cfg-titleFontSize" min="14" max="42" value="20" class="ctrl-slider">
                    </div>
                </div>
            </div>

            <!-- Colores — horizontal, hex editable primero -->
            <div class="sidebar-section" style="padding-bottom:.2rem">
                <label class="ctrl-label" style="margin-bottom:.4rem">Colores</label>
                <div class="color-ctrl-row">
                    <span class="ctrl-label-inline">Títulos</span>
                    <input type="text" id="cfg-titleColorHex" class="color-hex-input" value="#7C6C5C" maxlength="7">
                    <input type="color" id="cfg-titleColor" class="ctrl-color" value="#7C6C5C">
                </div>
                <div class="color-ctrl-row">
                    <span class="ctrl-label-inline">Productos</span>
                    <input type="text" id="cfg-textColorHex" class="color-hex-input" value="#7C6C5C" maxlength="7">
                    <input type="color" id="cfg-textColor" class="ctrl-color" value="#7C6C5C">
                </div>
                <div class="color-ctrl-row">
                    <span class="ctrl-label-inline">Fondo página</span>
                    <input type="text" id="cfg-bgPageHex" class="color-hex-input" value="#0e0e0e" maxlength="7">
                    <input type="color" id="cfg-bgPage" class="ctrl-color" value="#0e0e0e">
                </div>
                <div class="color-ctrl-row">
                    <span class="ctrl-label-inline">Fondo menú</span>
                    <input type="text" id="cfg-bgMenuHex" class="color-hex-input" value="#1A1A1A" maxlength="7">
                    <input type="color" id="cfg-bgMenu" class="ctrl-color" value="#1A1A1A">
                </div>
            </div>

            <!-- Imagen fondo página (feature-gated) -->
            <!-- Precios -->
            <div class="sidebar-section">
                <label class="ctrl-label">Precios</label>
                <label class="bg-remove-toggle">
                    <input type="checkbox" id="cfg-hidePrices">
                    <span>Publicar el menú sin precios</span>
                </label>
            </div>

            <div class="sidebar-section feature-gated-section" id="pageBgSection">
                <label class="ctrl-label">Fondo de página <span class="plan-lock-badge" id="pageBgBadge"></span></label>
                <div class="bg-img-row">
                    <div id="pageBgThumb" class="bg-img-thumb"></div>
                    <button id="pageBgBtn" class="btn-bg-upload">Subir imagen</button>
                    <button id="pageBgRemove" class="btn-bg-remove" style="display:none">×</button>
                </div>
                <input type="file" id="pageBgFile" accept="image/*" style="display:none">
            </div>

            <!-- Imagen fondo menú (feature-gated) -->
            <div class="sidebar-section feature-gated-section" id="menuBgSection">
                <label class="ctrl-label">Fondo del menú <span class="plan-lock-badge" id="menuBgBadge"></span></label>
                <div class="bg-img-row">
                    <div id="menuBgThumb" class="bg-img-thumb"></div>
                    <button id="menuBgBtn" class="btn-bg-upload">Subir imagen</button>
                    <button id="menuBgRemove" class="btn-bg-remove" style="display:none">×</button>
                </div>
                <input type="file" id="menuBgFile" accept="image/*" style="display:none">
                <div id="menuBgExtras" style="display:none;margin-top:8px">
                    <div class="ctrl-row" style="gap:6px;align-items:center">
                        <span class="ctrl-label-inline" style="flex-shrink:0">Blur</span>
                        <input type="range" id="menuBgBlur" min="0" max="20" value="0" class="ctrl-slider">
                        <span id="menuBgBlurVal" style="font-size:.65rem;color:#c8b89a;width:22px;text-align:right;flex-shrink:0">0px</span>
                    </div>
                    <div class="ctrl-row" style="gap:6px;align-items:center;margin-top:5px">
                        <span class="ctrl-label-inline" style="flex-shrink:0">Overlay</span>
                        <input type="color" id="menuBgOverlayColor" class="ctrl-color" value="#000000">
                        <input type="range" id="menuBgOverlayOpacity" min="0" max="100" value="0" class="ctrl-slider">
                        <span id="menuBgOverlayVal" style="font-size:.65rem;color:#c8b89a;width:28px;text-align:right;flex-shrink:0">0%</span>
                    </div>
                </div>
            </div>

            <!-- Logo -->
            <div class="sidebar-section">
                <label class="ctrl-label">Logo del restaurante</label>
                <div class="mini-drop" id="logoDrop">
                    <span id="logoDropText">Arrastrá o clic</span>
                    <img id="logoPreview" style="display:none;max-width:100%;max-height:80px;margin-top:6px;border-radius:4px;">
                </div>
                <!-- Tamaño y opacidad del logo -->
                <div class="size-controls-row" style="margin-top:6px">
                    <div class="size-ctrl">
                        <label class="ctrl-label">Tamaño <span id="cfg-logoSizeVal" class="ctrl-value">200px</span></label>
                        <input type="range" id="cfg-logoSize" min="40" max="860" value="200" class="ctrl-slider">
                    </div>
                    <div class="size-ctrl">
                        <label class="ctrl-label">Opacidad <span id="cfg-logoOpacityVal" class="ctrl-value">100%</span></label>
                        <input type="range" id="cfg-logoOpacity" min="10" max="100" value="100" class="ctrl-slider">
                    </div>
                </div>
                <label class="bg-remove-toggle">
                    <input type="checkbox" id="logoBgRemove" checked>
                    <span>Quitar fondo al subir</span>
                </label>
                <button class="btn-remove-bg-now" id="logoRemoveBgNowBtn" style="display:none"><i data-lucide="sparkles" class="icon" style="width:12px;height:12px;stroke-width:1.75"></i> Quitar fondo ahora</button>
                <button class="btn-remove-asset" id="logoRemoveBtn" style="display:none"><i data-lucide="x" class="icon" style="width:12px;height:12px;stroke-width:2"></i> Quitar logo</button>
            </div>

            <!-- ── PIE DEL MENÚ ── -->
            <hr class="sidebar-divider">
            <h3 class="sidebar-title">Pie del menú</h3>

            <div class="sidebar-section">
                <label class="ctrl-label">Cartel de la carta</label>
                <label class="bg-remove-toggle">
                    <input type="checkbox" id="cfg-showDisclaimer" checked>
                    <span>Mostrar «Fuera de carta en pizarra»</span>
                </label>
            </div>

            <div class="sidebar-section">
                <label class="ctrl-label">Aviso al pie</label>
                <input type="text" id="cfg-footerNotice" class="ctrl-input-text"
                       placeholder="Fuera de Carta en Pizarra">
            </div>

            <div class="sidebar-section">
                <label class="ctrl-label">Dirección del local</label>
                <input type="text" id="cfg-footerAddress" class="ctrl-input-text"
                       placeholder="Av. Ejemplo 1234, Ciudad (opcional)">
            </div>

            <div class="sidebar-section feature-gated-section" id="socialsSection">
                <label class="ctrl-label">Redes sociales y contacto <span class="plan-lock-badge" id="socialsBadge"></span></label>
                <div id="socialsContainer" class="socials-list"></div>
                <div id="socialColorPresets" style="display:none;gap:4px;flex-wrap:wrap;margin-bottom:6px"></div>
                <div class="social-picker-grid" id="socialPickerRow"></div>
            </div>

        </aside>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/lucide@0.309.0/dist/umd/lucide.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./Js/theme.js"></script>
    <script src="./Js/firebase-config.js?v=4"></script>
    <script src="./Js/benefits-config.js?v=2"></script>
    <script src="script.js?v=18"></script>
    <script>document.addEventListener('DOMContentLoaded', () => lucide.createIcons());</script>
</body>
</html>
