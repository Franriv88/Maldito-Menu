<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <script>/* Dominio oficial: los dominios técnicos de Firebase redirigen a cubierto.menu */if(/\.(web\.app|firebaseapp\.com)$/.test(location.hostname))location.replace('https://cubierto.menu'+location.pathname+location.search+location.hash);</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cubierto — Iniciá sesión</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="stylesheet" href="./Css/auth.css?v=5">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,300;1,400&display=swap" rel="stylesheet">
    <style>
        .login-card h1 {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-weight: 300;
            font-size: 3.2rem;
            letter-spacing: .5px;
        }
        .blocked-notice {
            margin: 1.2rem 0 0;
            padding: .75rem 1rem;
            background: rgba(220,53,69,.1);
            border: 1px solid rgba(220,53,69,.3);
            border-radius: 8px;
            color: #e06070;
            font-size: .82rem;
            line-height: 1.5;
        }
    </style>
</head>
<body class="login-page">

    <div class="login-card">
        <h1>Cubierto</h1>
        <p class="subtitle">Creá y compartí tu menú digital</p>

        <button id="googleSignInBtn" class="btn-google">
            <span class="g-icon">
                <svg width="20" height="20" viewBox="0 0 48 48">
                    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                    <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                    <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                    <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                </svg>
            </span>
            <span class="btn-spinner"></span>
            <span class="btn-label">Continuar con Google</span>
        </button>

        <div class="auth-divider"><span>o con tu email</span></div>

        <form id="emailForm" class="auth-form" novalidate>
            <input type="email" id="loginEmail" class="auth-input" placeholder="Email" autocomplete="email" required>
            <div class="pw-wrap">
                <input type="password" id="loginPassword" class="auth-input" placeholder="Contraseña" autocomplete="current-password" required>
                <button type="button" class="pw-toggle" data-for="loginPassword" aria-label="Mostrar la contraseña" title="Mostrar la contraseña"></button>
            </div>
            <p class="auth-msg" id="authMsg" role="alert"></p>
            <button type="submit" class="btn-auth" id="emailSignInBtn">Iniciar sesión</button>
            <button type="button" class="auth-link" id="forgotBtn">¿Olvidaste tu contraseña?</button>
        </form>

        <p class="auth-switch">¿No tenés cuenta? <a href="./?signup=1">Creá una gratis</a></p>

        <p class="login-disclaimer">Solo vos podés ver y editar tu menú.</p>
        <p class="login-legal">Al continuar aceptás los <a href="./terminos.html">Términos y condiciones</a>
            y la <a href="./privacidad.html">Política de privacidad</a>.</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/lucide@0.309.0/dist/umd/lucide.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="./Js/firebase-config.js?v=4"></script>
    <script src="./Js/password-toggle.js?v=1"></script>
    <script>
        auth.languageCode = 'es';   // los emails de Firebase (recuperar contraseña) en español
        const $ = id => document.getElementById(id);
        const msg = (text, kind = 'error') => { const m = $('authMsg'); m.textContent = text; m.dataset.kind = kind; };
        const isEmail = v => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);

        // Mostrar aviso si el usuario fue bloqueado
        if (new URLSearchParams(location.search).get('reason') === 'blocked') {
            const card = document.querySelector('.login-card');
            const notice = document.createElement('p');
            notice.className = 'blocked-notice';
            const ico = lucide.createElement(lucide.Ban); ico.setAttribute('width',14); ico.setAttribute('height',14); ico.setAttribute('stroke-width','1.75'); ico.style.cssText='display:inline-block;vertical-align:middle';
            notice.appendChild(ico);
            notice.insertAdjacentHTML('beforeend', ' <strong>Cuenta suspendida.</strong><br>Tu acceso fue bloqueado por el administrador. Contactá a <a href="mailto:frivasv2388@gmail.com" style="color:#e06070">soporte</a> para regularizar tu situación.');
            card.appendChild(notice);
            card.querySelectorAll('button, input').forEach(el => { el.disabled = true; });
            card.classList.add('is-blocked');
        }

        auth.onAuthStateChanged(user => {
            if (!user) return;
            window.location.href = user.email === 'frivasv2388@gmail.com' ? './superadmin.html' : './dashboard.html';
        });

        $('googleSignInBtn').addEventListener('click', function () {
            const btn   = this;
            const label = btn.querySelector('.btn-label');
            btn.disabled = true;
            btn.classList.add('is-loading');
            label.textContent = 'Conectando…';

            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).catch(err => {
                console.error('Error al iniciar sesión:', err);
                btn.disabled = false;
                btn.classList.remove('is-loading');
                label.textContent = 'Continuar con Google';
                if (err.code !== 'auth/popup-closed-by-user' && err.code !== 'auth/cancelled-popup-request') msg('No se pudo iniciar sesión con Google. Intentá de nuevo.');
            });
        });

        // ── Email y contraseña ──
        $('emailForm').addEventListener('submit', async e => {
            e.preventDefault();
            const email = $('loginEmail').value.trim(), pass = $('loginPassword').value;
            if (!isEmail(email)) { msg('Escribí un email válido.'); $('loginEmail').focus(); return; }
            if (!pass) { msg('Escribí tu contraseña.'); $('loginPassword').focus(); return; }
            const btn = $('emailSignInBtn');
            btn.disabled = true; btn.textContent = 'Entrando…'; msg('');
            try {
                await auth.signInWithEmailAndPassword(email, pass);   // onAuthStateChanged redirige
            } catch (err) {
                console.warn('Login con email:', err.code);
                btn.disabled = false; btn.textContent = 'Iniciar sesión';
                if (['auth/invalid-credential', 'auth/wrong-password', 'auth/user-not-found', 'auth/invalid-login-credentials'].includes(err.code)) {
                    msg('Email o contraseña incorrectos. Si te registraste con Google, usá «Continuar con Google».');
                } else if (err.code === 'auth/too-many-requests') {
                    msg('Demasiados intentos. Esperá unos minutos o recuperá tu contraseña.');
                } else if (err.code === 'auth/user-disabled') {
                    msg('Esta cuenta está deshabilitada. Contactá a soporte.');
                } else if (err.code === 'auth/operation-not-allowed') {
                    msg('El ingreso con email todavía no está habilitado. Usá «Continuar con Google».');
                } else {
                    msg('No se pudo iniciar sesión. Revisá tu conexión e intentá de nuevo.');
                }
            }
        });

        // ── Recuperar contraseña: Firebase manda un enlace para crear una nueva ──
        $('forgotBtn').addEventListener('click', async () => {
            const email = $('loginEmail').value.trim();
            if (!isEmail(email)) { msg('Escribí tu email arriba y volvé a tocar «¿Olvidaste tu contraseña?».', 'info'); $('loginEmail').focus(); return; }
            const btn = $('forgotBtn');
            btn.disabled = true;
            try {
                await auth.sendPasswordResetEmail(email, { url: location.origin + '/login.html' });
            } catch (err) {
                console.warn('Recuperar contraseña:', err.code);
                if (err.code === 'auth/too-many-requests') { msg('Ya pediste varios enlaces. Esperá unos minutos.'); btn.disabled = false; return; }
                // Otros errores (ej. email sin cuenta): mismo mensaje, para no revelar qué emails están registrados
            }
            msg(`Si hay una cuenta con ${email}, te mandamos un enlace para crear una contraseña nueva. Revisá tu bandeja (y la carpeta de spam).`, 'ok');
            setTimeout(() => { btn.disabled = false; }, 30000);
        });
    </script>
</body>
</html>
